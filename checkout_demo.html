<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaymentG — QRIS Checkout Simulator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f0f2f5; color: #1c1e21; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); width: 100%; max-width: 440px; padding: 28px; text-align: center; }
    .header { margin-bottom: 24px; }
    .header h1 { font-size: 22px; color: #ee4d2d; font-weight: 700; margin-bottom: 6px; }
    .header p { font-size: 13px; color: #65676b; }
    .form-group { text-align: left; margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #4b4f56; }
    input { width: 100%; padding: 12px 14px; border: 1.5px solid #ccd0d5; border-radius: 8px; font-size: 14px; transition: border-color 0.2s; }
    input:focus { outline: none; border-color: #ee4d2d; }
    button { width: 100%; padding: 13px; background: #ee4d2d; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #d73211; }
    button:disabled { background: #bec3c9; cursor: not-allowed; }
    .qr-box { margin-top: 24px; padding: 20px; background: #fafbfc; border: 1px dashed #d0d7de; border-radius: 12px; display: none; }
    .qr-img { width: 230px; height: 230px; margin: 12px auto; display: block; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .amount-highlight { font-size: 26px; font-weight: 800; color: #ee4d2d; margin: 8px 0; }
    .unique-note { font-size: 12px; color: #e65100; background: #fff3e0; padding: 6px 10px; border-radius: 6px; margin: 10px 0; display: inline-block; }
    .status-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-top: 10px; }
    .status-pending { background: #fff8e1; color: #f57f17; }
    .status-paid { background: #e8f5e9; color: #2e7d32; font-size: 15px; }
    .timer { font-size: 13px; color: #8a8d91; margin-top: 6px; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>ShopeePay QRIS Checkout</h1>
    <p>Simulator Pembayaran Otomatis Nominal Unik</p>
  </div>

  <div id="checkout-form">
    <div class="form-group">
      <label>X-API-Key Toko:</label>
      <input type="text" id="api-key" placeholder="ak_xxxxxxxxxxxx" value="ak_iFV5BsdprjxCb4AnpkCkrYzc" />
    </div>

    <div class="form-group">
      <label>Nominal Pembayaran (Rp):</label>
      <input type="number" id="base-amount" value="10000" step="1000" />
    </div>

    <button id="btn-pay" onclick="createOrder()">Bayar dengan QRIS</button>
  </div>

  <div id="qr-container" class="qr-box">
    <p style="font-size: 13px; color: #65676b;">Scan QRIS ini dari ShopeePay / Bank / E-Wallet:</p>
    <img id="qr-image" class="qr-img" src="" alt="QRIS Code" />

    <div class="unique-note">⚠️ Bayar <b>Tepat</b> sesuai nominal di bawah ini:</div>
    <div class="amount-highlight" id="total-display">Rp 0</div>

    <div>
      <span id="order-status" class="status-badge status-pending">Menunggu Pembayaran...</span>
    </div>
    <div class="timer" id="timer-display">Batas bayar: 15:00</div>

    <button style="margin-top: 16px; background: #0070f3;" onclick="forceCheck()">Saya Sudah Bayar (Cek Cepat)</button>
  </div>
</div>

<script>
  let currentOrderId = null;
  let pollInterval = null;
  let secondsLeft = 900;
  const baseUrl = "http://localhost:3200";

  async function createOrder() {
    const apiKey = document.getElementById("api-key").value.trim();
    const amount = parseInt(document.getElementById("base-amount").value);

    if (!apiKey) {
      alert("Harap masukkan X-API-Key terlebih dahulu!");
      return;
    }
    if (!amount || amount <= 0) {
      alert("Nominal harus lebih dari 0!");
      return;
    }

    const btn = document.getElementById("btn-pay");
    btn.disabled = true;
    btn.innerText = "Membuat QRIS...";

    try {
      const res = await fetch(`${baseUrl}/api/orders`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-API-Key": apiKey
        },
        body: JSON.stringify({
          reference_id: "INV-" + Date.now(),
          amount: amount,
          expiry_minutes: 15
        })
      });

      const json = await res.json();
      if (!json.success) {
        throw new Error(json.error || "Gagal membuat pesanan");
      }

      const order = json.data;
      currentOrderId = order.order_id;

      // Update UI
      document.getElementById("total-display").innerText = "Rp " + Number(order.total_amount).toLocaleString("id-ID");
      
      // Load QR Image using fetch with API key to bypass browser header restrictions
      const qrRes = await fetch(`${baseUrl}${order.qr_url}`, {
        headers: { "X-API-Key": apiKey }
      });
      const blob = await qrRes.blob();
      document.getElementById("qr-image").src = URL.createObjectURL(blob);

      document.getElementById("qr-container").style.display = "block";
      document.getElementById("checkout-form").style.display = "none";

      // Start polling status
      startPolling(apiKey);
      startTimer();

    } catch (err) {
      alert("Error: " + err.message);
      btn.disabled = false;
      btn.innerText = "Bayar dengan QRIS";
    }
  }

  function startTimer() {
    secondsLeft = 900;
    const timerElem = document.getElementById("timer-display");
    const interval = setInterval(() => {
      secondsLeft--;
      if (secondsLeft <= 0) {
        clearInterval(interval);
        timerElem.innerText = "Order Kedaluwarsa!";
        return;
      }
      const m = Math.floor(secondsLeft / 60);
      const s = secondsLeft % 60;
      timerElem.innerText = `Batas bayar: ${m}:${s < 10 ? '0' : ''}${s}`;
    }, 1000);
  }

  function startPolling(apiKey) {
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(async () => {
      if (!currentOrderId) return;
      try {
        const res = await fetch(`${baseUrl}/api/orders/${currentOrderId}`, {
          headers: { "X-API-Key": apiKey }
        });
        const json = await res.json();
        if (json.success && json.data.status === "PAID") {
          clearInterval(pollInterval);
          const badge = document.getElementById("order-status");
          badge.className = "status-badge status-paid";
          badge.innerHTML = "🎉 PEMBAYARAN LUNAS!";
          alert("Pembayaran berhasil diverifikasi!");
        }
      } catch (e) {
        console.error("Poll error", e);
      }
    }, 3000);
  }

  async function forceCheck() {
    const apiKey = document.getElementById("api-key").value.trim();
    if (!currentOrderId || !apiKey) return;
    try {
      const res = await fetch(`${baseUrl}/api/orders/${currentOrderId}/check`, {
        method: "POST",
        headers: { "X-API-Key": apiKey }
      });
      const json = await res.json();
      if (json.success && json.data.status === "PAID") {
        clearInterval(pollInterval);
        const badge = document.getElementById("order-status");
        badge.className = "status-badge status-paid";
        badge.innerHTML = "🎉 PEMBAYARAN LUNAS!";
        alert("Pembayaran berhasil diverifikasi!");
      } else {
        alert("Status: " + (json.data ? json.data.status : "Belum terdeteksi"));
      }
    } catch (e) {
      alert("Cek gagal: " + e.message);
    }
  }
</script>

</body>
</html>
